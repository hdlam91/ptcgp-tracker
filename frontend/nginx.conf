server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Card and pack art downloaded from Settings lives on the backend's volume. When a file isn't
    # there (or the backend is down) this is a plain error, and the app falls back to GitHub.
    location ^~ /card-images/ {
        proxy_pass http://backend:8080/local-images/cards/;
        proxy_set_header Host $host;
    }
    location ^~ /pack-images/ {
        proxy_pass http://backend:8080/local-images/packs/;
        proxy_set_header Host $host;
    }

    # Hashed build output never changes under the same name.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry points must be revalidated on every load, or a new release (and the service
    # worker update that comes with it) can be hidden behind a stale cached copy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        # nginx's bundled MIME table doesn't know this extension.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
