<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTCGP Tracker</title>
    <script>
      // Runs before any CSS/Vue paints, so there's no flash of the wrong theme.
      // Kept in sync with the storage key in src/composables/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('ptcgp-theme')
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) document.documentElement.classList.add('dark')
        }
        catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
