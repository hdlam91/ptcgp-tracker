<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTCGP Tracker</title>
    <meta name="description" content="Track your Pokémon TCG Pocket collection, wishlist and trades." />
    <!-- Match the browser/status bar to the page background (the web app manifest supplies the brand colour). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <!-- iOS Safari reads these for "Add to Home Screen"; it ignores manifest icons. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PTCGP Tracker" />
    <script>
      // Runs before any CSS/Vue paints, so there's no flash of the wrong theme.
      // Kept in sync with the storage key in src/composables/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('ptcgp-theme')
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) document.documentElement.classList.add('dark')
        }
        catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
