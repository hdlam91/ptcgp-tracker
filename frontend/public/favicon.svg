<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.28" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cardViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cardAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="badgeGloss" cx="0.32" cy="0.28" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="heroClip">
      <rect x="17" y="7" width="28" height="36" rx="4.5" transform="rotate(6 31 25)"/>
    </clipPath>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.3" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>

  <!-- fanned deck, back to front, each with its own gradient + drop shadow for depth -->
  <rect x="5" y="15" width="22" height="30" rx="3.2" fill="url(#cardRed)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.6" transform="rotate(-26 16 30)" filter="url(#dropShadow)"/>
  <rect x="8.5" y="12.5" width="22" height="30" rx="3.2" fill="url(#cardViolet)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.6" transform="rotate(-15 19.5 27.5)" filter="url(#dropShadow)"/>
  <rect x="13" y="10.5" width="22" height="30" rx="3.2" fill="url(#cardAmber)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.6" transform="rotate(-5 24 25.5)" filter="url(#dropShadow)"/>

  <!-- hero card -->
  <g transform="rotate(6 31 25)" filter="url(#dropShadow)">
    <rect x="17" y="7" width="28" height="36" rx="4.5" fill="url(#heroGrad)"/>
    <circle cx="24" cy="14" r="4" fill="url(#cornerGrad)"/>
    <rect x="22.5" y="34.5" width="18" height="2.6" rx="1.3" fill="#c7cde0"/>
    <rect x="22.5" y="39.2" width="13" height="2.6" rx="1.3" fill="#dbe0ea"/>
  </g>
  <rect x="17" y="7" width="28" height="36" clip-path="url(#heroClip)" fill="url(#sheen)"/>

  <!-- badge -->
  <circle cx="47" cy="47" r="15.5" fill="#ffffff" filter="url(#badgeShadow)"/>
  <circle cx="47" cy="47" r="12.8" fill="url(#badgeGrad)"/>
  <circle cx="47" cy="47" r="12.8" fill="url(#badgeGloss)"/>
  <path d="M40.7 47.3l4.2 4.2 8.7-9.3" fill="none" stroke="#ffffff" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
