# Builds the app from this checkout. Runs as-is with no .env: every setting has a default below,
# and .env (or exported variables) can override any of them. To run prebuilt images instead
# (no source needed), see docker-compose.selfhost.yml.
services:
  # Fake SMTP server for local dev: catches every email instead of sending it, viewable at
  # http://localhost:8025. Self-hosting points at a real provider instead (see the README).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ptcgp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ptcgp_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptcgp} -d ${POSTGRES_DB:-ptcgp_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ptcgp_tracker};Username=${POSTGRES_USER:-ptcgp};Password=${POSTGRES_PASSWORD:-changeme}"
      CardData__RepoTag: ${CARD_DATA_REPO_TAG:-v5.3.1}
      Admin__Emails: ${ADMIN_EMAILS:-}
      # Mailpit by default: a fake SMTP server, no real credentials needed for local dev.
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-false}
      APPLY_MIGRATIONS_ON_STARTUP: "true"
      ASPNETCORE_URLS: "http://+:8080"
    volumes:
      # Card art downloaded from Settings (see the README).
      - images:/data/images
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
  images:
